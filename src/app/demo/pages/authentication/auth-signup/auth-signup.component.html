<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="feather icon-user-plus auth-icon"></i>
        </div>
        <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
        <h3 class="mb-4">Sign up</h3>
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Prénom" formControlName="firstName"/>
        </div>
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Nom" formControlName="lastName" />
        </div>
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="CIN" formControlName="cin" />
        </div>
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Phone" formControlName="phone" />
        </div>
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Adresse" formControlName="adress"/>
        </div>
        <div class="input-group mb-3">
          <input type="email" class="form-control" placeholder="Email" formControlName="email"/>
        </div>
        <div class="input-group mb-4">
          <input type="password" class="form-control" placeholder="Password" formControlName="password" />
        </div>

        <div class="input-group mb-4">
          <input type="password" class="form-control" placeholder="Confirm Password" formControlName="confirmPassword" />
        </div>
        <div class="form-group text-start mb-4">
          <div class="checkbox checkbox-fill d-inline">
            <input type="checkbox" name="checkbox-fill-1" id="checkbox-fill-1" checked="" />
            <label for="checkbox-fill-1" class="cr">Save Details</label>
          </div>
        </div>
        <div class="form-group text-start mb-3">
          <div class="checkbox checkbox-fill d-inline">
            <input type="checkbox" name="checkbox-fill-2" id="checkbox-fill-2" />
            <label for="checkbox-fill-2" class="cr">
              Send me the
              <a href="javascript:">Newsletter</a>
              weekly.
            </label>
          </div>
        </div>
        <button class="btn btn-primary shadow-2 mb-4" [disabled]="registerForm.invalid" >Sign up</button>
        <p class="mb-0 text-muted">
          Already have an account?
          <a [routerLink]="['/login']">Log in</a>
        </p>
      </form>
      </div>
    </div>
  </div>
</div>

<div *ngIf="showMessage" class="modal-overlay">
  <div class="modal-box">

   @if (messageType=='success') { <div class="modal-icon">
      ✅
    </div>}
    @else{<div class="modal-icon">
      ⚠️
    </div>
  }

    <h2>SignUp @if(messageType=="error"){échouée} @else {réussi}</h2>
    <p class="modal-text">{{messageText}}</p>

    <div class="modal-actions">
      <button class="btn-close" (click)="closeRegisterModal()">Compris</button>
    </div>
  </div>
</div>
