<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="feather icon-unlock auth-icon"></i>
        </div>
        <h3 class="mb-4">Login</h3>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="input-group mb-3">
          <input type="email" class="form-control" placeholder="Email" formControlName="email" />
        </div>
        <div class="input-group mb-4">
          <input type="password" class="form-control" placeholder="Password" formControlName="password" />
        </div>
      
        <div class="form-group text-start mb-4">
          <div class="checkbox checkbox-fill d-inline">
            <input type="checkbox" name="checkbox-fill-1" id="checkbox-fill-a1" checked="" />
            <label for="checkbox-fill-a1" class="cr">Save Details</label>
          </div>
        </div>
        <button class="btn btn-primary mb-4"[disabled]="loginForm.invalid">Login</button>
        <p class="mb-2 text-muted">
          Forgot password?
          <a href="javascript:">Reset</a>
        </p>
        <p class="mb-0 text-muted">
          Don’t have an account?
          <a [routerLink]="['/register']">Sign up</a>
        </p>
      </form>
      </div>
    </div>
  </div>
</div>
<div *ngIf="notLoggedIn" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-icon">
      ⚠️
    </div>

    <h2>Connexion échouée</h2>
    <p class="modal-text">L'email ou le mot de passe saisi est incorrect. Veuillez vérifier vos identifiants et réessayer.</p>

    <div class="modal-actions">
      <button class="btn-close" (click)="closeLoginModal()">Compris</button>
    </div>
  </div>
</div>
