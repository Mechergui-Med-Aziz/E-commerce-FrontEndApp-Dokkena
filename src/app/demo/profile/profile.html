<div class="profile-container">

  <h2>👤 Mon Profil</h2>

  <div class="profile-card">

    <form>

      <div class="form-row">
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" [(ngModel)]="user.firstName" name="firstName"/>
        </div>

        <div class="form-group">
          <label>Nom</label>
          <input type="text" [(ngModel)]="user.lastName" name="lastName"/>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="user.email" name="email" disabled/>
      </div>

      <div class="form-group">
        <label>Adresse</label>
        <input type="text" [(ngModel)]="user.adress" name="adress"/>
      </div>

      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="••••••••"/>
      </div>

      <button class="btn-save" (click)="updateProfile()">💾 Mettre à jour</button>
    </form>

  </div>

</div>

<div *ngIf="updated" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-icon">
        ✅
      </div>
  
      <h2>Profil mis à jour avec succès</h2>
      <p class="modal-text">Vos informations ont été enregistrées correctement.</p>
  
      <div class="modal-actions">
        <button class="btn-close" (click)="closeUpdateModal()">OK</button>
      </div>
    </div>
  </div>
