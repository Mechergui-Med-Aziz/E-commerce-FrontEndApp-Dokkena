<!-- payment.component.html -->
<div class="max-w-sm mx-auto mt-10 p-6 bg-white rounded shadow-md">
  <h2 class="text-xl font-bold mb-4">Payez en ligne</h2>

  <div class="flex gap-2 mb-4">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Mastercard-logo.png" alt="Mastercard" class="h-6"/>
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" alt="Visa" class="h-6"/>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScVn05Th249P2kIXsCo30k0uV27Kzw6KOs-Q&s" alt="Discover" class="h-6"/>
    <img src="https://e7.pngegg.com/pngimages/287/428/png-clipart-computer-icons-jcb-co-ltd-credit-card-payment-credit-card-text-payment.png" alt="JCB" class="h-6"/>
  </div>

  <div class="mb-3">
    <label class="block mb-1 text-sm font-medium">Nom sur la carte</label>
    <input [(ngModel)]="nameOnCard" type="text" placeholder="Nom" class="w-full border px-3 py-2 rounded"/>
  </div>

  <div class="mb-3">
    <label class="block mb-1 text-sm font-medium">Détails de la carte</label>
    <div id="card-element" class="border p-3 rounded"></div>
  </div>

  <div class="text-red-600 text-sm mb-3" *ngIf="errorMessage">{{errorMessage}}</div>
  <div class="text-green-600 text-sm mb-3" *ngIf="successMessage">{{successMessage}}</div>

  <button (click)="pay()" 
        [disabled]="loading || !nameOnCard || !cardComplete"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition 
               disabled:bg-gray-400 disabled:cursor-not-allowed">
  {{ loading ? 'Paiement...' : 'Payer ' + amount + ' DT' }}
</button>

</div>


<div *ngIf="showMessage" class="modal-overlay">
  <div class="modal-box">

   @if (messageType=='success') { <div class="modal-icon">
      ✅
    </div>}
    @else{<div class="modal-icon">
      ⚠️
    </div>
  }

    <h2>Paiement @if(messageType=="error"){échoué} @else {réussi}</h2>
    <p class="modal-text">{{messageText}}</p>

    <div class="modal-actions">
      <button class="btn-close" (click)="closePaymentModal()">Compris</button>
    </div>
  </div>
</div>
